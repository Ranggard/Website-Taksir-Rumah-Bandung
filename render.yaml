services:
  - type: web
    name: taksir-rumah-bandung
    env: php
    region: singapore
    plan: free
    buildCommand: >
      composer install --optimize-autoloader --no-dev &&
      npm install &&
      npm run build &&
      php artisan storage:link
    startCommand: >
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan migrate --force &&
      php -S 0.0.0.0:$PORT public/index.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
